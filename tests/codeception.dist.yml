paths:
  tests: .
  output: ./_output
  data: ./_data
  support: ./_support
  envs: ./_envs
settings:
  colors: true
  memory_limit: 1024M
  backup_globals: false
actor_suffix: Tester
bootstrap: _bootstrap.php
extensions:
  enabled:
    - Codeception\Extension\RunFailed
  # WP generate:* commands from lucatume/wp-browser are incompatible with Codeception 5
  # (GenerateWPUnit::configure() re-adds the "suite" argument). They are not required to run tests.
  commands: []
params:
  - .env

##
# Module configurations that apply to all suites,
# unless overridden in the suite file.
##
modules:
  config:
    WPLoader:
      # loadOnly: false (We recommend each suite define this parameter explicitly)
      wpRootFolder: '%WP_ROOT_FOLDER%'
      dbName: '%TEST_DB_NAME%'
      dbHost: '%TEST_DB_HOST%'
      dbUser: '%TEST_DB_USER%'
      dbPassword: '%TEST_DB_PASSWORD%'
      tablePrefix: "%TABLE_PREFIX%"
      domain: "%WP_DOMAIN%"
      configFile: "%TEST_CONFIG_FILE%"
      multisite: false
      theme: twentytwentyfour
      plugins:
        - advanced-custom-fields/acf.php
        - acf-color-swatches/acf-swatch.php
        - posts-to-posts/posts-to-posts.php
      activatePlugins:
        - advanced-custom-fields/acf.php
        - acf-color-swatches/acf-swatch.php
        - posts-to-posts/posts-to-posts.php
      bootstrapActions:
        - [\Tribe\Libs\Blog_Copier\Copy_Manager, register_post_type]
        - [P2P_Storage, install]
        - [P2P_Storage, init]


env:
  singlesite:
  # nothing changes
  multisite:
    modules:
      config:
        WPLoader:
          multisite: true


