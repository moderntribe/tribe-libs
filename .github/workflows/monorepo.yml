name: Monorepo Release

on:
  push:
    tags:
      - '*'

jobs:
  list-repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3

      - name: Set repo matrix
        id: set-matrix
        run: echo "matrix=$(php ./dev/monorepo/scripts/repo-map.php)" >> "$GITHUB_OUTPUT"

  split:
    needs: list-repos
    runs-on: ubuntu-latest
    env:
      # Match the major release line for this branch (create `5.x` in sub-repos first
      # via sub-repo-branch-create.yml if missing).
      split_branch: '5.x'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-repos.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Monorepo Tagged Split of ${{ matrix.package }}
        uses: moderntribe/monorepo-split-github-action@4.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.TR1B0T_TRIBE_LIBS_MONOREPO_TOKEN }}
        with:
          tag: ${GITHUB_REF#refs/tags/}
          package_directory: 'src/${{ matrix.package.directory }}'
          repository_organization: 'moderntribe'
          repository_name: '${{ matrix.package.name }}'
          user_name: '${{ github.actor }}'
          user_email: '${{ github.actor }}@users.noreply.github.com'
          branch: '${{ env.split_branch }}'
